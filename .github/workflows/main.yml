name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyMuPDF ezdxf Pillow

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name ArchitectAIStudio --add-data "index.html;." launcher.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ArchitectAIStudio-Windows
          path: dist/ArchitectAIStudio.exe
