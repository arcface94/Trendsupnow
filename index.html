<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCHITECT AI STUDIO</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#e5ebf5;background:#0c111b}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{border:1px solid #344058;background:#1b2637;color:#f3f5fc;border-radius:9px;padding:10px 14px;cursor:pointer}button:hover{background:#283750}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#c52b36;border-color:#c52b36}.primary:hover{background:#da3541}input,select,textarea{background:#0d1522;color:white;border:1px solid #364157;padding:11px;border-radius:9px;width:100%}textarea{min-height:75px}.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}aside{background:#101824;border-right:1px solid #263246;padding:27px 17px}.brand{font-size:16px;font-weight:800;letter-spacing:.06em;line-height:1.3}.brand span{color:#ee626c}.sub{color:#8292a8;font-size:11px;margin-top:9px}.menu{margin-top:35px;display:grid;gap:9px}.nav{padding:12px;border-radius:8px;color:#91a1b7;cursor:pointer}.nav.active,.nav:hover{background:#222e42;color:#fff}.bottom{margin-top:38px;font-size:12px;color:#8593a9;line-height:1.7}main{padding:32px;min-width:0}h1{font-size:27px;margin:0 0 9px}h2{font-size:17px;margin:0 0 15px}p{color:#9cabbd;line-height:1.55}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.panel{border:1px solid #2b374a;background:#131d2b;border-radius:14px;padding:22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.metric{font-size:27px;font-weight:800;padding-top:8px}.muted{color:#91a1b5;font-size:13px}.name{font-weight:700;font-size:16px}.project{cursor:pointer;min-height:150px}.project:hover{border-color:#bd4c56}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag{display:inline-block;background:#243148;padding:5px 9px;border-radius:6px;font-size:11px;color:#b1bfce}.tag.lock{background:#17483b;color:#a0edcd}.tag.review{background:#513b24;color:#ffe0a4}.hidden{display:none!important}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.workspace{background:#070d16;border:1px solid #2d394e;border-radius:12px;min-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.workspace img{max-width:100%;max-height:70vh;object-fit:contain;user-select:none;transform-origin:center;cursor:grab}.workspace .empty{color:#7890a8;text-align:center;padding:45px}.drawing{border:1px solid #334158;padding:11px;margin:10px 0;border-radius:9px;cursor:pointer;overflow-wrap:anywhere}.drawing.active{border-color:#d95f69;background:#2a2535}.timeline{max-height:280px;overflow:auto;font-size:12px}.event{padding:9px 0;border-bottom:1px solid #293448}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20}.modal>.panel{width:min(490px,94vw);max-height:90vh;overflow:auto}.stack{display:grid;gap:13px}label{font-size:12px;color:#9babbd;display:grid;gap:6px}.file{padding:16px;border:1px dashed #56657b;border-radius:9px}.sectiontitle{margin:30px 0 15px}.layer{font-size:12px;display:block;margin:5px 0}.layer input{width:auto;margin-right:6px}small{color:#8596ac}.toast{position:fixed;bottom:20px;right:20px;max-width:400px;background:#293a50;padding:16px;border-radius:9px;box-shadow:0 8px 25px #0006;z-index:50}@media(max-width:1050px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:720px){.shell{grid-template-columns:1fr}aside{padding:16px}.menu{margin-top:12px;display:flex}.bottom{display:none}main{padding:18px}.grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside><div class="brand">ARCHITECT<span> AI</span><br>STUDIO</div><div class="sub">Professional design workspace · Stage 01</div><div class="menu"><div class="nav active" onclick="home()">▦ &nbsp; Projects</div><div class="nav" onclick="modules()">◈ &nbsp; Modules</div></div><div class="bottom">GURU CAD 3.0 protocol<br>Immutable original references<br>Approval-based revisions<br><br><span class="tag">LOCAL EDITION</span></div></aside><main id="app"></main></div><div id="modal" class="modal hidden"><div class="panel" id="modalbody"></div></div><div id="toast" class="toast hidden"></div><script>
let projects=[],drawings=[],audit=[],activeProject=null,activeDrawing=null,zoom=1,page=0,meta={layers:[],pages:1};const app=document.getElementById('app');const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts){let r=await fetch(url,opts);let data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}async function refresh(){[projects,drawings,audit]=await Promise.all(['/api/projects','/api/drawings','/api/audit'].map(x=>api(x)))}function say(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),4000)}function dialog(content){document.getElementById('modalbody').innerHTML=content;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
async function home(){activeProject=null;await refresh();app.innerHTML=`<header><div><h1>Project Portfolio</h1><p>Manage architectural projects, drawing baselines and approvals.</p></div><button class="primary" onclick="createProject()">+ New Project</button></header><div class="grid"><div class="panel"><span class="muted">Active projects</span><div class="metric">${projects.filter(x=>!x.archived).length}</div></div><div class="panel"><span class="muted">Uploaded drawings</span><div class="metric">${drawings.length}</div></div><div class="panel"><span class="muted">Approved · locked</span><div class="metric">${drawings.filter(x=>x.status==='APPROVED_LOCKED').length}</div></div></div><h2 class="sectiontitle">Projects</h2><div class="grid">${projects.filter(x=>!x.archived).map(p=>`<div class="panel project" onclick="openProject('${p.id}')"><div class="name">${E(p.name)}</div><p>${E(p.location||'Location not specified')} · ${E(p.kind||'Architecture')}</p><span class="tag">${drawings.filter(d=>d.project_id===p.id).length} drawings</span></div>`).join('')||'<div class="panel" style="grid-column:1/-1"><h2>No projects yet</h2><p>Create a project to upload and preserve your first R00 drawing.</p></div>'}</div>`}
function createProject(){dialog(`<h2>Create architectural project</h2><form id="newProject" class="stack"><label>Project name<input name="name" required placeholder="e.g. Hotel Holiday"></label><label>Location<input name="location" placeholder="City, state"></label><label>Project type<select name="kind"><option>Hospitality</option><option>Healthcare</option><option>Residential</option><option>Commercial</option><option>Mixed use</option><option>Other</option></select></label><label>Description<textarea name="description"></textarea></label><div class="actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Create project</button></div></form>`);document.getElementById('newProject').onsubmit=async e=>{e.preventDefault();try{await api('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();home()}catch(err){say(err.message)}}}
async function openProject(id){activeProject=id;activeDrawing=null;await refresh();renderProject()}
function renderProject(){const p=projects.find(x=>x.id===activeProject);if(!p)return home();let ds=drawings.filter(d=>d.project_id===activeProject),events=audit.filter(x=>x.project_id===activeProject).slice(0,18);app.innerHTML=`<header><div><button onclick="home()">← All projects</button><h1 style="margin-top:17px">${E(p.name)}</h1><div class="muted">${E(p.location)} · ${E(p.kind)} · ${ds.length} drawings</div></div><button class="primary" onclick="upload()">+ Upload drawing</button></header><div class="layout"><div><div class="panel"><div class="actions" style="justify-content:space-between"><h2>Drawing viewer</h2><div class="actions"><button onclick="magnify(-1)">−</button><span id="scale">100%</span><button onclick="magnify(1)">+</button><button onclick="magnify(0)">Fit</button></div></div><div class="workspace" id="workspace"><div class="empty">Select an uploaded drawing to preview.<br><small>PDF, PNG, JPG and supported DXF vector entities</small></div></div><div id="viewerControls" class="actions" style="margin-top:12px"></div><div id="layers"></div></div><div class="panel" style="margin-top:16px"><h2>Audit trail</h2><div class="timeline">${events.map(e=>`<div class="event"><strong>${E(e.action)}</strong><div class="muted">${E(e.created.slice(0,19).replace('T',' '))}</div><small>${E(e.details)}</small></div>`).join('')||'<p>No actions recorded</p>'}</div></div></div><div><div class="panel"><h2>Drawings & revisions</h2>${ds.map(d=>`<div class="drawing ${d.id===activeDrawing?'active':''}" onclick="selectDrawing('${d.id}')"><div class="name">${E(d.name)}</div><div class="muted">R${String(d.revision).padStart(2,'0')} · ${E(d.kind.toUpperCase())}</div><span class="tag ${d.status==='APPROVED_LOCKED'?'lock':d.status==='REVIEW'?'review':''}">${d.status==='APPROVED_LOCKED'?'🔒 ':''}${E(d.status)}</span></div>`).join('')||'<p>No drawings uploaded.</p>'}<div id="drawingActions"></div></div><div class="panel" style="margin-top:16px"><h2>Baseline policy</h2><p>Original drawings are never overwritten. Approved revisions cannot be modified. Any change requires a new file, a stated reason and a separate revision.</p><small>Stored data remains on this computer. No cloud collaboration or AI generation in Stage 01.</small></div></div></div>`;if(activeDrawing)selectDrawing(activeDrawing)}
function upload(parent){let original=parent?drawings.find(d=>d.id===parent):null;dialog(`<h2>${parent?'Create authorized revision':'Upload original R00 baseline'}</h2><p>${parent?'The original approved drawing remains immutable. Explain the proposed change.':'Upload a reference file without changing its geometry.'}</p><form id="uploadForm" class="stack"><label class="file">Drawing file (PDF, PNG, JPG, DXF; up to 40 MB)<input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.dxf" required></label>${parent?'<label>Change reason and impact<textarea name="reason" required placeholder="Explain precisely what is changing and why"></textarea></label>':''}<div id="uploadProgress" class="muted"></div><div class="actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Upload ${parent?'new revision':'R00'}</button></div></form>`);document.getElementById('uploadForm').onsubmit=async e=>{e.preventDefault();let f=e.target.file.files[0];let reason=e.target.reason?.value||'';document.getElementById('uploadProgress').textContent='Uploading and validating…';try{let u='/api/upload?'+new URLSearchParams({project_id:activeProject,name:f.name,...(parent?{parent_id:parent,reason}:{})});await api(u,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:f});closeModal();await refresh();activeDrawing=null;renderProject();say('Drawing stored with SHA-256 fingerprint')}catch(err){document.getElementById('uploadProgress').textContent=err.message}}}
async function selectDrawing(id){activeDrawing=id;let d=drawings.find(x=>x.id===id);if(!d)return;zoom=1;page=0;try{meta=await api('/api/layers/'+id)}catch(err){meta={layers:[],pages:1};say(err.message)}showFile();document.querySelectorAll('.drawing').forEach(x=>x.classList.toggle('active',x.textContent.includes(d.name)));document.getElementById('drawingActions').innerHTML=`<div style="margin-top:16px"><div class="muted">SHA-256 fingerprint</div><small style="overflow-wrap:anywhere">${E(d.sha256)}</small><div class="actions" style="margin-top:15px">${d.status==='DRAFT'?`<button onclick="changeStatus('${id}','REVIEW')">Submit for review</button>`:''}${d.status==='REVIEW'?`<button class="primary" onclick="approve('${id}')">Approve & lock</button>`:''}${d.status==='APPROVED_LOCKED'?`<button onclick="upload('${id}')">+ Propose new revision</button>`:''}</div></div>`}
function showFile(){let d=drawings.find(x=>x.id===activeDrawing);if(!d)return;let ws=document.getElementById('workspace');ws.innerHTML=`<img id="drawingImage" src="/api/view/${d.id}${d.kind==='pdf'?'?page='+page:''}" alt="Drawing viewer">`;document.getElementById('viewerControls').innerHTML=meta.pages>1?`<button onclick="changePage(-1)" ${page===0?'disabled':''}>Previous</button><span>Page ${page+1} of ${meta.pages}</span><button onclick="changePage(1)" ${page>=meta.pages-1?'disabled':''}>Next</button>`:'';document.getElementById('layers').innerHTML=meta.layers.length?`<h2 style="margin-top:18px">Visible DXF layers</h2>${meta.layers.map((l,i)=>`<label class="layer"><input type="checkbox" checked onchange="toggleLayer(${i},this.checked)"> ${E(l)}</label>`).join('')}<p><small>DXF preview currently supports straight line, polyline, circle and arc entities. Text, blocks, hatch and dimensions may not render.</small></p>`:'';magnify(0)}
function toggleLayer(i,show){let im=document.getElementById('drawingImage');if(!im)return;fetch(im.src).then(r=>r.text()).then(s=>{let doc=new DOMParser().parseFromString(s,'image/svg+xml');doc.querySelectorAll('g[data-layer]').forEach(g=>{if(g.getAttribute('data-layer')===meta.layers[i])g.style.display=show?'':'none'});im.src=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(doc)],{type:'image/svg+xml'}))})}
function changePage(n){page+=n;showFile()}function magnify(n){zoom=n===0?1:Math.min(8,Math.max(.2,zoom+(n*.25)));let im=document.getElementById('drawingImage');if(im)im.style.transform=`scale(${zoom})`;let s=document.getElementById('scale');if(s)s.textContent=Math.round(zoom*100)+'%'}
async function changeStatus(id,status){try{await api('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});await refresh();renderProject();say('Submitted for review')}catch(err){say(err.message)}}function approve(id){dialog(`<h2>Approve and permanently lock geometry?</h2><p>Approval permanently locks this drawing revision. The original file cannot be edited or unlocked. Any change must be uploaded as a separate revision.</p><div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="lockNow('${id}')">Confirm permanent lock</button></div>`)}async function lockNow(id){try{await api('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:'APPROVED_LOCKED',confirm:'LOCK_GEOMETRY'})});closeModal();await refresh();renderProject();say('Geometry locked permanently for this revision')}catch(err){say(err.message)}}function modules(){activeProject=null;app.innerHTML=`<header><div><h1>Architectural Intelligence Modules</h1><p>Development roadmap — these modules are not enabled in Stage 01.</p></div></header><div class="grid">${[['ATLAS','Climate, sun path and site analysis'],['GURU','AI CAD drafting and professional detailing'],['BONE','BIM and structural coordination'],['SOUL','Interior design and documentation'],['EARTH','Landscape and site works'],['VISION','Photorealistic AI visualization'],['FRAME','Drawing sheets and portfolio']].map(x=>`<div class="panel"><h2>${x[0]}</h2><p>${x[1]}</p><span class="tag">Planned</span></div>`).join('')}</div>`}home();
</script></body></html>
